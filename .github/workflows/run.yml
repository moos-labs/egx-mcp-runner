name: Run

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Borsagator composed commands (overrides vars.COMMANDS)'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          git clone --depth 1 https://github.com/Patrickboules/EGX-MCP.git server_src
      - name: Run commands
        run: ${{ inputs.commands || vars.COMMANDS }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
